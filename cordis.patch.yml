- insert:
    - id: persona-memory-coordinator
      name: 'dsh-xiangxu-persona'
      config:
        enabled: true
        role: coordinator
        timezone: Asia/Shanghai
        consolidationMode: sleep
    - id: preset-persona-memory
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: persona-memory
        name: 相续人格
        description: 连续记忆与自主性格；由人格决定交流、等待与睡眠
        plugins:
          - id: persona-history
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: persona-history-basic
                name: '@deepseek-ai/dsh-compaction-basic'
                config:
                  auto: true
                  thresholdRatio: 0.8
                  retainRatio: 0.16
                  headroomTokens: 8192
                  maxTokens: 4096
                  compactionRetries: 0
                  maxOverflowRetries: 1
                  modelPolicies:
                    - provider: deepseek-official
                      model: deepseek-flash
                      thresholdRatio: 0.049152
                      retainTokens: 8192
              - id: persona-history-command
                name: '@deepseek-ai/dsh-command-compact'
              - id: persona-history-tool-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - name: 'dsh-xiangxu-persona'
            config:
              role: agent
