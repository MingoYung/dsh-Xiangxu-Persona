<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>dsh-Xiangxu-Persona · 相续人格管理</title>
  <link rel="stylesheet" href="./style.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app-shell">
    <nav class="navigation" aria-label="相续人格设置分类">
      <button type="button" data-page="overview">运行总览</button>
      <button type="button" data-page="persona">共同人格</button>
      <button type="button" data-page="memory">记忆与关系</button>
      <button type="button" data-page="evolution">进化与变更</button>
      <button type="button" data-page="settings">设置与加载</button>
      <button type="button" data-page="chat">聊天渠道与语音</button>
      <button type="button" data-page="media">形象与创作</button>
      <button type="button" data-page="maintenance">维护与诊断</button>
    </nav>
    <div class="workspace">
      <div class="page-tools"><span id="connection-state" class="status-pill neutral" role="status">正在连接</span><button id="refresh-button" class="button subtle compact" type="button" disabled>刷新</button></div>
      <main id="main" tabindex="-1">
        <div class="page-header"><div><h1 id="page-title">运行总览</h1><p id="page-description">连接后显示当前实例的真实运行状态。</p></div><div id="page-actions" class="page-actions"></div></div>
        <div id="global-error" class="notice error" role="alert" hidden></div>
        <div id="instance-bar" class="instance-bar"><label for="active-instance">当前人格</label><select id="active-instance" disabled><option value="">等待连接</option></select><details class="instance-location"><summary>数据位置</summary><span id="instance-root" class="path">尚未读取记忆目录</span></details></div>
        <section id="page-content" aria-live="polite"><div class="connection-card"><h2>正在读取相续人格</h2><p class="muted" id="connection-detail">正在等待 DSH 管理连接……</p><button id="connect-retry" class="button secondary" type="button">重新连接</button></div></section>
        <footer class="page-footer"><span id="last-updated">尚未读取数据</span><span id="build-version">DSH 插件</span></footer>
      </main>
    </div>
  </div>
  <dialog id="detail-dialog" class="detail-dialog" aria-labelledby="detail-title"><div class="dialog-header"><div><span id="detail-eyebrow" hidden></span><h2 id="detail-title">详情</h2></div><button id="close-detail" class="icon-button" type="button" aria-label="关闭详情">×</button></div><div id="detail-content" class="dialog-body"></div><div id="detail-footer" class="dialog-footer"></div></dialog>
  <dialog id="confirm-dialog" class="confirm-dialog" aria-labelledby="confirm-title"><div><div class="dialog-header"><h2 id="confirm-title">确认操作</h2><button id="confirm-close" type="button" class="icon-button" aria-label="取消">×</button></div><div class="dialog-body"><p id="confirm-description"></p><pre id="confirm-preview" class="data-preview" hidden></pre><label id="confirm-reason-label" class="field" hidden><span>操作说明</span><textarea id="confirm-reason" rows="3" placeholder="记录这次明确操作的原因"></textarea></label></div><div class="dialog-footer"><button id="confirm-cancel" type="button" class="button secondary">取消</button><button id="confirm-accept" type="button" class="button primary">确认执行</button></div></div></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
